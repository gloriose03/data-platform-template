name: Test Script

on:
  workflow_dispatch:
  pull_request:

jobs:
  test-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run script
        uses: ./.github/actions/smus-project-updates
        with:
          environment: dev
          target: governance
          parameter_group: update-smus-project-members
          deployment_action: update_project_members
