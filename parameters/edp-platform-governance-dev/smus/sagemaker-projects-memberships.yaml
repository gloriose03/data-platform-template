# ==========================================================
# Project Membership Configuration
#
# Add your details under the "members" section to request
# access to one or more SMUS projects into an account.
#
# - Each member can belong to multiple domain/projects.
# - Add a new block under "members" with your email and the
#   projects you need access to.
# - If a member is removed from this file, their access will
#   also be removed automatically.
#
# This structure is used because users may require different
# roles across multiple domains and projects.
# ==========================================================

account:
  number: "1234567890" # AWS account number
  name: aws_account_name_test # name of the AWS account

members:
  - email: name.surname@company.co.uk
    domain_projects:
      - domain_name: the_data_team_domain
        project_name: airflow_project
        designation: PROJECT_CONTRIBUTOR
      - domain_name: the_second_domain_team
        project_name: another_project
        designation: PROJECT_OWNER

  - email: anothername.anothersurname@company.co.uk
    domain_projects:
      - domain_name: the_data_team_domain
        project_name: airflow_project
        designation: PROJECT_OWNER
